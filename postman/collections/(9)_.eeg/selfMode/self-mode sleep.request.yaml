$kind: http-request
url: "{{url-api}}/api/v1/self-mode"
method: POST
body:
  type: json
  content: |-
    {
        // 모든 항목을 지우고 다시 넣는거라 일부 삭제할 경우 제외한 리스트만 다시 주시면 됩니다.
        // sleep/shield/rescue 모두 동일한 api 호출하나 필수 인지만 다릅니다.
        
        // -.rescue|sleep|shield
        "mode":"sleep",
        "isRun":"Y",
        
        // -.sleep mode
        "sleepList":[
            {
                "name":"슬립",
                "runTime":"22:00",
                "alarmTime":10
            }
        ],

        // 필수이나 empty[]이어도 되지만 해당 항목은 있어야 함.
        "rescueList":[],
        "shieldList":[]

    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
settings: {}
order: 2000
