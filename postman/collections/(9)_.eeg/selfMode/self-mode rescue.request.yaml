$kind: http-request
url: "{{url-api}}/api/v1/self-mode"
method: POST
body:
  type: json
  content: |-
    {
        // 모든 항목을 지우고 다시 넣는거라 일부 삭제할 경우 제외한 리스트만 다시 주시면 됩니다.
        // -.rescue|sleep|shield
        "mode":"rescue",
        "isRun":"Y",
        
        // -.rescue & shield mode
        "isAllday":"N",

        "rescueList": [
            {
                "name":"구출이름r",
                "startTime":"09:00",
                "endTime":"18:00",
                // -.rescue & shield mode
                "selfAppList":[
                    {
                        "mode":"rescue",
                        "packageName":"app.pkg.com",
                        "name":"앱이름r1",
                        "isAllow":"Y",
                        "time":20
                    },
                    {
                        "mode":"rescue",
                        "packageName":"app2.pkg.com",
                        "name":"앱이름r2",
                        "isAllow":"Y",
                        "time":20
                    }
                ]
            }
        ],

        // 필수이나 empty[]이어도 되지만 해당 항목은 있어야 함.
        "shieldList":[],
        "sleepList":[]
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
settings: {}
order: 4000
