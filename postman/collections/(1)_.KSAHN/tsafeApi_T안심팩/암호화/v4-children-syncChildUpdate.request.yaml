$kind: http-request
name: v4/children/syncChildUpdate
url: "{{svr-https-tsafe-api}}/v4/children/syncChildUpdate"
method: POST
headers:
  - key: fineTree
    value: off
    disabled: true
    description: 암복호 on/off
  - key: deviceTime
    value: "1234567890"
  - key: prodId
    value: NA00004907
    description: 유해차단
  - key: apiToken
    value: "{{refreshAccessToken}}"
  - key: apiToken
    value: "{{json_web_token_00od}}"
    disabled: true
  - key: apiToken
    value: EpprhhFHhWK6C6WBDDCEubw01iqLU5ck4rdIyj66mX8={{childSeq}}
    disabled: true
  - key: phoneNumber
    value: "01096481770"
body:
  type: text
  content: |
    {
        "pushToken" : "fpt8hG_oRA2LXAP632VCwq:APA91bFh_Hq5TnidM4OZq6SSp0KD0frHTxK-iERN41aFElfwkey4DBYcrv4vem8M7dSZGaEzXLBvxOBrdocl6w8N6uwxKAmUaxnx-0OVECTTkIPXqwKcfcs",
        "deviceAdminActiveStatus" : "1",
        "accessibilityActiveStatus" : "1",
        "lastUsageLogTimestamp" : "1761231234567",
        "storeType" : "2",
        "locationPermission" : "4"
    }

    /*
        "lastManagedAppUpdateDttm" : 1798038827674,
    */
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      // Test for successful response (status code 200)
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      // Parse JSON response and save apiToken to environment variable
      pm.test("Save apiToken to refreshAccessToken environment variable", function () {
          const jsonData = pm.response.json();
          
          pm.expect(jsonData).to.have.property("apiToken");
          
          if (jsonData.apiToken) {
              pm.environment.set("refreshAccessToken", jsonData.apiToken);
              console.log("refreshAccessToken has been updated with the new apiToken");
          }
      });
    language: text/javascript
settings: {}
order: 5000
